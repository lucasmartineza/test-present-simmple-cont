<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Completá la oración - Inglés</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(135deg, #6dd5ed, #ffe27a);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 560px;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    padding: 28px;
    text-align: center;
  }
  h1 { font-size: 22px; color: #2b2b2b; margin: 0 0 4px; }
  .subtitle { color: #777; font-size: 14px; margin-bottom: 18px; }

  /* ---------- LEVEL SCREEN ---------- */
  .level-btn {
    display: block;
    width: 100%;
    padding: 18px;
    margin-bottom: 14px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    font-size: 17px;
    font-weight: bold;
    color: white;
    text-align: left;
    transition: transform 0.15s ease;
  }
  .level-btn:hover { transform: scale(1.03); }
  .level-btn small { display: block; font-weight: normal; font-size: 13px; opacity: 0.9; margin-top: 3px; }
  .level-easy { background: linear-gradient(135deg, #56ab2f, #a8e063); }
  .level-mid { background: linear-gradient(135deg, #1e88e5, #42a5f5); }
  .level-hard { background: linear-gradient(135deg, #d81b60, #f06292); }

  /* ---------- GAME SCREEN ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 14px;
    font-weight: bold;
  }
  .score { color: #2e8b57; }
  .progress-wrap { width: 100%; background: #eee; border-radius: 10px; height: 10px; overflow: hidden; margin-bottom: 20px; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #43cea2, #185a9d); width: 0%; transition: width 0.3s ease; }

  .badges-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; }
  .badge.simple { background: #43a047; }
  .badge.continuo { background: #1e88e5; }
  .badge.ropa { background: #d81b60; }
  .badge.level { background: #555; }

  .timer-wrap {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .timer-ring {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid #1e88e5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    color: #1e88e5;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .timer-ring.warning { border-color: #f9a825; color: #f9a825; }
  .timer-ring.danger { border-color: #e53935; color: #e53935; }
  .timer-label { font-size: 12.5px; color: #888; }

  .sentence { font-size: 21px; color: #222; line-height: 1.5; margin-bottom: 10px; font-weight: 600; }
  .blank { display: inline-block; min-width: 90px; border-bottom: 3px solid #999; color: transparent; }

  .hint-box {
    background: #fff8e1;
    border: 1px dashed #ffb300;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13.5px;
    color: #8a6100;
    margin-bottom: 18px;
    text-align: left;
  }
  .hint-box b { color: #6d4c00; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
  .opt-btn {
    padding: 14px 8px;
    font-size: 16px;
    border-radius: 14px;
    border: 2px solid #ccc;
    background: #f7f7f7;
    cursor: pointer;
    transition: all 0.15s ease;
    font-weight: 600;
    color: #333;
  }
  .opt-btn:hover:not(:disabled) { border-color: #185a9d; background: #eef6ff; transform: translateY(-2px); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct { background: #c8f7c5; border-color: #2e8b57; color: #1b5e20; }
  .opt-btn.incorrect { background: #ffd2d2; border-color: #e53935; color: #b71c1c; }

  .feedback { min-height: 26px; font-size: 16px; font-weight: bold; margin: 12px 0 4px; }
  .feedback.ok { color: #2e8b57; }
  .feedback.bad { color: #e53935; }

  .explanation {
    display: none;
    background: #fdecea;
    border-left: 4px solid #e53935;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13.5px;
    color: #7a1f1f;
    text-align: left;
    margin-bottom: 14px;
  }
  .explanation b { color: #b71c1c; }

  .next-btn, .restart-btn, .level-select-btn {
    margin-top: 10px;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    background: #185a9d;
    color: white;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .next-btn:hover, .restart-btn:hover, .level-select-btn:hover { transform: scale(1.05); }
  .next-btn:disabled { background: #bbb; cursor: not-allowed; }
  .level-select-btn { background: #777; margin-left: 8px; }

  /* ---------- FINAL SCREEN ---------- */
  .final { display: none; }
  .final h2 { font-size: 26px; margin-bottom: 6px; }
  .final p { font-size: 16px; color: #555; }
  .trophy { font-size: 60px; margin-bottom: 10px; }
  .btn-row { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }

  .glossary {
    margin-top: 28px;
    text-align: left;
    background: #f4f7fb;
    border-radius: 16px;
    padding: 18px 20px;
  }
  .glossary h3 { margin: 0 0 12px; font-size: 17px; color: #185a9d; text-align: center; }
  .glossary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 20px;
  }
  .glossary-item {
    font-size: 14px;
    padding: 6px 0;
    border-bottom: 1px solid #dde5ee;
    display: flex;
    justify-content: space-between;
  }
  .glossary-item .en { font-weight: bold; color: #222; }
  .glossary-item .es { color: #777; }

  @media (max-width: 420px) {
    .options { grid-template-columns: 1fr; }
    .sentence { font-size: 18px; }
    .glossary-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="card">

  <!-- LEVEL SELECT -->
  <div id="levelScreen">
    <h1>Completá la oración</h1>
    <div class="subtitle">Presente simple &middot; Presente continuo &middot; Ropa y vestimenta</div>
    <button class="level-btn level-easy" onclick="selectLevel('easy')">
      🟢 Fácil
      <small>Con pistas y menos opciones para elegir</small>
    </button>
    <button class="level-btn level-mid" onclick="selectLevel('mid')">
      🔵 Intermedio
      <small>Sin pistas, opciones y oraciones estándar</small>
    </button>
    <button class="level-btn level-hard" onclick="selectLevel('hard')">
      🔴 Difícil
      <small>Sin pistas, más opciones y vocabulario avanzado</small>
    </button>
  </div>

  <!-- GAME -->
  <div id="gameScreen" style="display:none;">
    <div class="topbar">
      <span>Pregunta <span id="qNumber">1</span>/<span id="qTotal">12</span></span>
      <span class="score">Puntos: <span id="scoreVal">0</span></span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

    <div class="badges-row">
      <div id="badge" class="badge simple">Presente simple</div>
      <div id="levelBadge" class="badge level">Fácil</div>
    </div>

    <div class="timer-wrap" id="timerWrap">
      <div class="timer-ring" id="timerRing">10</div>
      <span class="timer-label">segundos</span>
    </div>

    <div class="sentence" id="sentence"></div>
    <div class="hint-box" id="hintBox" style="display:none;"><b>Pista:</b> <span id="hintText"></span></div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanationBox"><b>¿Por qué?</b> <span id="explanationText"></span></div>
    <button class="next-btn" id="nextBtn" disabled>Siguiente →</button>
  </div>

  <!-- FINAL -->
  <div id="finalScreen" class="final">
    <div class="trophy" id="trophyEmoji">🏆</div>
    <h2 id="finalTitle">¡Muy bien!</h2>
    <p id="finalScore">Puntaje: 0/12</p>
    <div class="btn-row">
      <button class="restart-btn" id="restartBtn">Jugar de nuevo</button>
      <button class="level-select-btn" id="changeLevelBtn">Cambiar nivel</button>
    </div>

    <div class="glossary">
      <h3>👕 Para seguir aprendiendo: vocabulario de ropa</h3>
      <div class="glossary-grid" id="glossaryGrid"></div>
    </div>
  </div>

</div>

<script>

  { en: "Gloves", es: "Guantes" },
  { en: "Hat", es: "Gorro / sombrero" },
  { en: "Cap", es: "Gorra" },
  { en: "Boots", es: "Botas" },
  { en: "Sneakers", es: "Zapatillas" },
  { en: "Sandals", es: "Sandalias" },
  { en: "Shorts", es: "Shorts" },
  { en: "Skirt", es: "Pollera" },
  { en: "Dress", es: "Vestido" },
  { en: "Blouse", es: "Blusa" },
  { en: "Suit", es: "Traje" },
  { en: "Tie", es: "Corbata" },
  { en: "Belt", es: "Cinturón" },
  { en: "Socks", es: "Medias" },
  { en: "Pajamas", es: "Pijama" },
  { en: "Swimsuit", es: "Traje de baño" },
  { en: "Cardigan", es: "Saco tejido" },
  { en: "Blazer", es: "Blazer / saco" },
  { en: "Mittens", es: "Manoplas" },
  { en: "Robe", es: "Bata" },
  { en: "Apron", es: "Delantal" },
  { en: "Flip-flops", es: "Ojotas" },
];

const catLabels = { simple: "Presente simple", continuo: "Presente continuo", ropa: "Ropa y vestimenta" };
const levelLabels = { easy: "Fácil", mid: "Intermedio", hard: "Difícil" };
const levelBanks = { easy: easyBank, mid: midBank, hard: hardBank };

let quiz = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let currentLevel = "mid";
let timerInterval = null;
let timeLeft = 10;
const TIME_LIMIT = 10;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function selectLevel(level) {
  currentLevel = level;
  startGame();
}

function startGame() {
  clearInterval(timerInterval);
  const bank = levelBanks[currentLevel];
  const numQuestions = bank.length;
  quiz = shuffle(bank).map(q => ({ ...q, shuffledOptions: shuffle(q.options) }));
  currentIndex = 0;
  score = 0;

  document.getElementById("levelScreen").style.display = "none";
  document.getElementById("finalScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("qTotal").textContent = numQuestions;
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = quiz[currentIndex];
  const numQuestions = quiz.length;

  document.getElementById("qNumber").textContent = currentIndex + 1;
  document.getElementById("scoreVal").textContent = score;
  document.getElementById("progressBar").style.width = (currentIndex / numQuestions * 100) + "%";

  const badge = document.getElementById("badge");
  badge.textContent = catLabels[q.cat];
  badge.className = "badge " + q.cat;

  document.getElementById("levelBadge").textContent = levelLabels[currentLevel];

  document.getElementById("sentence").innerHTML = q.sentence.replace("___", "<span class='blank'>______</span>");

  const hintBox = document.getElementById("hintBox");
  if (currentLevel === "easy" && q.hint) {
    hintBox.style.display = "block";
    document.getElementById("hintText").textContent = q.hint;
  } else {
    hintBox.style.display = "none";
  }

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  q.shuffledOptions.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, btn);
    optionsDiv.appendChild(btn);
  });

  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("explanationBox").style.display = "none";
  document.getElementById("nextBtn").disabled = true;

  if (currentLevel === "mid") {
    document.getElementById("timerWrap").style.display = "flex";
    startTimer();
  } else {
    document.getElementById("timerWrap").style.display = "none";
    clearInterval(timerInterval);
  }
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = TIME_LIMIT;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const ring = document.getElementById("timerRing");
  ring.textContent = timeLeft;
  ring.classList.remove("warning", "danger");
  if (timeLeft <= 3) ring.classList.add("danger");
  else if (timeLeft <= 6) ring.classList.add("warning");
}

function handleTimeout() {
  if (answered) return;
  answered = true;
  const q = quiz[currentIndex];
  const numQuestions = quiz.length;
  const buttons = document.querySelectorAll(".opt-btn");
  const feedback = document.getElementById("feedback");

  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add("correct");
  });

  feedback.textContent = "¡Se acabó el tiempo! ⏰ La respuesta era: " + q.answer;
  feedback.className = "feedback bad";
  if (q.why) {
    document.getElementById("explanationText").textContent = q.why;
    document.getElementById("explanationBox").style.display = "block";
  }

  document.getElementById("progressBar").style.width = ((currentIndex + 1) / numQuestions * 100) + "%";
  document.getElementById("nextBtn").disabled = false;
}

function selectAnswer(chosen, btnEl) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  const q = quiz[currentIndex];
  const numQuestions = quiz.length;
  const buttons = document.querySelectorAll(".opt-btn");
  const feedback = document.getElementById("feedback");

  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add("correct");
  });

  if (chosen === q.answer) {
    score++;
    feedback.textContent = "¡Correcto! 🎉";
    feedback.className = "feedback ok";
  } else {
    btnEl.classList.add("incorrect");
    feedback.textContent = "Casi... la respuesta era: " + q.answer;
    feedback.className = "feedback bad";
    if (q.why) {
      document.getElementById("explanationText").textContent = q.why;
      document.getElementById("explanationBox").style.display = "block";
    }
  }

  document.getElementById("scoreVal").textContent = score;
  document.getElementById("progressBar").style.width = ((currentIndex + 1) / numQuestions * 100) + "%";
  document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quiz.length) {
    showFinal();
  } else {
    renderQuestion();
  }
}

function showFinal() {
  document.getElementById("gameScreen").style.display = "none";
  const finalScreen = document.getElementById("finalScreen");
  finalScreen.style.display = "block";

  const numQuestions = quiz.length;
  const pct = score / numQuestions;
  let title, trophy;
  if (pct === 1) { title = "¡Perfecto, sos una crack!"; trophy = "🏆"; }
  else if (pct >= 0.7) { title = "¡Muy bien hecho!"; trophy = "🌟"; }
  else if (pct >= 0.5) { title = "¡Bien! Seguí practicando."; trophy = "👍"; }
  else { title = "¡Vamos de nuevo, vos podés!"; trophy = "💪"; }

  document.getElementById("trophyEmoji").textContent = trophy;
  document.getElementById("finalTitle").textContent = title;
  document.getElementById("finalScore").textContent = "Puntaje: " + score + "/" + numQuestions + "  (" + levelLabels[currentLevel] + ")";

  renderGlossary();
}

function renderGlossary() {
  const grid = document.getElementById("glossaryGrid");
  grid.innerHTML = "";
  glossary.forEach(item => {
    const div = document.createElement("div");
    div.className = "glossary-item";
    div.innerHTML = "<span class='en'>" + item.en + "</span><span class='es'>" + item.es + "</span>";
    grid.appendChild(div);
  });
}

document.getElementById("nextBtn").addEventListener("click", nextQuestion);
document.getElementById("restartBtn").addEventListener("click", startGame);
document.getElementById("changeLevelBtn").addEventListener("click", () => {
  document.getElementById("finalScreen").style.display = "none";
  document.getElementById("levelScreen").style.display = "block";
});
</script>
</body>
